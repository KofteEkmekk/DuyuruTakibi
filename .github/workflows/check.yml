name: Duyuru Kontrol

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duyuru-kontrol
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install requests beautifulsoup4

      - name: Duyurulari kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_announcements.py

      - name: Durumu kaydet
        run: |
          git config user.name "duyuru-bot"
          git config user.email "duyuru-bot@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "Duyuru durumu guncellendi" && git push)
